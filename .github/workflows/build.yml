name: FFmpeg Image Build

# Manual only. Pushes and pull requests do not build or publish.
# Run this after merging a change you want in ghcr.io/dispatcharr/ffmpeg.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      repo_owner: ${{ steps.meta.outputs.repo_owner }}
      ffmpeg_version: ${{ steps.versions.outputs.ffmpeg_version }}
      tag_suffix: ${{ steps.versions.outputs.tag_suffix }}
      ubuntu_base: ${{ steps.versions.outputs.ubuntu_base }}
    steps:
      - uses: actions/checkout@v6

      - name: Read versions.env
        id: versions
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./versions.env
          echo "ffmpeg_version=${FFMPEG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=${IMAGE_TAG_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "ubuntu_base=${UBUNTU_BASE}" >> "$GITHUB_OUTPUT"

      - name: Set image metadata
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"

  docker:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            UBUNTU_BASE=${{ needs.prepare.outputs.ubuntu_base }}
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/ffmpeg:${{ needs.prepare.outputs.ffmpeg_version }}-${{ needs.prepare.outputs.tag_suffix }}-${{ matrix.platform }}
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/ffmpeg:${{ needs.prepare.outputs.ffmpeg_version }}-${{ matrix.platform }}
          cache-from: type=gha,scope=ffmpeg-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=ffmpeg-${{ matrix.platform }}
          provenance: false

  manifest:
    needs: [prepare, docker]
    runs-on: ubuntu-26.04
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          OWNER: ${{ needs.prepare.outputs.repo_owner }}
          VER: ${{ needs.prepare.outputs.ffmpeg_version }}
          SUFFIX: ${{ needs.prepare.outputs.tag_suffix }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/${OWNER}/ffmpeg:${VER}-${SUFFIX}" \
            -t "ghcr.io/${OWNER}/ffmpeg:${VER}" \
            "ghcr.io/${OWNER}/ffmpeg:${VER}-${SUFFIX}-amd64" \
            "ghcr.io/${OWNER}/ffmpeg:${VER}-${SUFFIX}-arm64"

          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/dev" ]]; then
            docker buildx imagetools create \
              -t "ghcr.io/${OWNER}/ffmpeg:latest" \
              "ghcr.io/${OWNER}/ffmpeg:${VER}-${SUFFIX}-amd64" \
              "ghcr.io/${OWNER}/ffmpeg:${VER}-${SUFFIX}-arm64"
          fi
