name: Version bump PRs

# Daily, on push to main, and manual. One independent pin per job / PR branch.
# Each job updates versions.env (and README when that pin is named there). After
# one merges, the push to main re-runs this workflow and create-pull-request
# rebuilds any still-needed bump branches from current main.
# Merge the pull request to approve the bump, then run the image build workflow manually.
#
# Pins (series / ref gates in versions.env):
#   ffmpeg              FFMPEG_SERIES (e.g. 9)
#   nv-codec-headers    NV_CODEC_HEADERS_SERIES (e.g. 13.0, not 13.1)
#   fdk-aac-stripped    FDK_AAC_STRIPPED_REF tip (stripped5)
#   x264                X264_REF tip (master)
#   x265                X265_SERIES (e.g. 4)
#   lame                newest Ubuntu pool orig tarball
#   opus                OPUS_SERIES (e.g. 1)
#   dav1d               DAV1D_SERIES (e.g. 1)
#   libvpx              LIBVPX_SERIES (e.g. 1)

on:
  schedule:
    # Daily 15:00 UTC
    - cron: '0 15 * * *'
  # Refresh open bump branches after one of them merges (or any other main push).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ffmpeg:
    name: Bump FFmpeg
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Resolve latest series release
        id: latest
        run: |
          set -euo pipefail
          chmod +x scripts/resolve-ffmpeg-version.sh
          # shellcheck disable=SC1091
          . ./versions.env
          NEW_VERSION="$(./scripts/resolve-ffmpeg-version.sh --version)"
          NEW_URL="$(./scripts/resolve-ffmpeg-version.sh --url)"
          echo "current=${FFMPEG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "url=${NEW_URL}" >> "$GITHUB_OUTPUT"
          echo "series=${FFMPEG_SERIES}" >> "$GITHUB_OUTPUT"
          if [[ "${NEW_VERSION}" == "${FFMPEG_VERSION}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Current pin: ${FFMPEG_VERSION}"
          echo "Latest ${FFMPEG_SERIES}.x release: ${NEW_VERSION}"

      - name: Update versions.env
        if: steps.latest.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.latest.outputs.version }}
          NEW_URL: ${{ steps.latest.outputs.url }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s|^FFMPEG_VERSION=.*|FFMPEG_VERSION=${NEW_VERSION}|" \
            -e "s|^FFMPEG_URL=.*|FFMPEG_URL=${NEW_URL}|" \
            versions.env
          # Keep README table in sync when present
          if grep -q '| FFmpeg |' README.md; then
            sed -i -E "s/^\| FFmpeg \| .*\|$/| FFmpeg | ${NEW_VERSION} (pinned in \`versions.env\`) |/" README.md
          fi
          echo "Updated versions.env:"
          grep -E '^FFMPEG_(SERIES|VERSION|URL)=' versions.env

      - name: Close version-specific bump pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --limit 50 \
            --json number,headRefName,title \
            --jq '.[] | select(.headRefName | startswith("chore/ffmpeg-")) | select(.headRefName != "chore/ffmpeg-bump") | select(.title | startswith("chore: bump FFmpeg to ")) | .number')
          for n in "${prs[@]}"; do
            [[ -z "$n" ]] && continue
            gh pr close "$n" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Superseded. The chore/ffmpeg-bump pull request tracks the latest FFmpeg series release."
          done

      - name: Create or update pull request
        if: steps.latest.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Default author is whoever triggered the run. These commits are automated.
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: chore/ffmpeg-bump
          delete-branch: true
          commit-message: |
            chore: bump FFmpeg to ${{ steps.latest.outputs.version }}

            Latest ${{ steps.latest.outputs.series }}.x point release from ffmpeg.org.
          title: "chore: bump FFmpeg to ${{ steps.latest.outputs.version }}"
          body: |
            ## Summary
            - Bump `FFMPEG_VERSION` from `${{ steps.latest.outputs.current }}` to `${{ steps.latest.outputs.version }}` (series `${{ steps.latest.outputs.series }}`).
            - Source: `${{ steps.latest.outputs.url }}`

            ## Test plan
            - [ ] Merge this PR, then run `build.yml` manually (image builds are not triggered by PRs)
            - [ ] `ffmpeg -version` in the published image reports `${{ steps.latest.outputs.version }}`
            - [ ] Smoke script still asserts no `nonfree` / `openssl`

  nv-codec-headers:
    name: Bump nv-codec-headers
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Resolve latest headers on the pinned API line
        id: latest
        run: |
          set -euo pipefail
          chmod +x scripts/resolve-nv-codec-headers.sh
          # shellcheck disable=SC1091
          . ./versions.env
          NEW_TAG="$(./scripts/resolve-nv-codec-headers.sh --tag)"
          NEW_URL="$(./scripts/resolve-nv-codec-headers.sh --url)"
          echo "current=${NV_CODEC_HEADERS_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "url=${NEW_URL}" >> "$GITHUB_OUTPUT"
          echo "series=${NV_CODEC_HEADERS_SERIES}" >> "$GITHUB_OUTPUT"
          if [[ "${NEW_TAG}" == "${NV_CODEC_HEADERS_TAG}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Current pin: ${NV_CODEC_HEADERS_TAG}"
          echo "Latest ${NV_CODEC_HEADERS_SERIES} tag: ${NEW_TAG}"

      - name: Update versions.env
        if: steps.latest.outputs.changed == 'true'
        env:
          NEW_TAG: ${{ steps.latest.outputs.tag }}
          NEW_URL: ${{ steps.latest.outputs.url }}
          OLD_TAG: ${{ steps.latest.outputs.current }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s|^NV_CODEC_HEADERS_TAG=.*|NV_CODEC_HEADERS_TAG=${NEW_TAG}|" \
            -e "s|^NV_CODEC_HEADERS_URL=.*|NV_CODEC_HEADERS_URL=${NEW_URL}|" \
            versions.env
          # README names the pinned tag. Replace that exact tag, not the API line.
          if grep -F -q "${OLD_TAG}" README.md; then
            sed -i "s/${OLD_TAG//./\\.}/${NEW_TAG}/g" README.md
          fi
          echo "Updated versions.env:"
          grep -E '^NV_CODEC_HEADERS_' versions.env

      - name: Create or update pull request
        if: steps.latest.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: chore/nv-codec-headers-bump
          delete-branch: true
          commit-message: |
            chore: bump nv-codec-headers to ${{ steps.latest.outputs.tag }}

            Latest tag on NVENC API ${{ steps.latest.outputs.series }}.
          title: "chore: bump nv-codec-headers to ${{ steps.latest.outputs.tag }}"
          body: |
            ## Summary
            - Bump `NV_CODEC_HEADERS_TAG` from `${{ steps.latest.outputs.current }}` to `${{ steps.latest.outputs.tag }}` (NVENC API `${{ steps.latest.outputs.series }}`).
            - Source: `${{ steps.latest.outputs.url }}`
            - `NV_CODEC_HEADERS_SERIES` and `IMAGE_TAG_SUFFIX` are not changed. A different API line is a separate pin, not this bump.

            ## Test plan
            - [ ] Merge this PR, then run `build.yml` manually (image builds are not triggered by PRs)
            - [ ] Smoke script still expects NVENC API `${{ steps.latest.outputs.series }}`

